[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omnimira"
version = "0.1.0"
description = "OmniMIRA: per-ROI universal brain feature space"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
    "nibabel>=5.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
demo = ["matplotlib>=3.5", "gradio>=4.0", "nilearn>=0.10"]

[tool.setuptools.packages.find]
include = ["omnimira*"]

[tool.setuptools.data-files]
"omnimira_release/configs" = [
    "configs/input_contract.yaml",
    "configs/output_schema.json",
    "configs/omnimira_3atlas.yaml",
]
"omnimira_release/assets/atlases" = ["assets/atlases/*.json"]

# Self-contained test discovery: keeps `pytest` run from this package root
# from walking up into the internal monorepo's pytest.ini.
[tool.pytest.ini_options]
testpaths = ["tests"]
